<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Orçamentos 3Degraus - Chaveiros Personalizados</title>
  <meta name="description" content="Sistema de geração de orçamentos de chaveiros personalizados 3Degraus com visualização 3D e exportação para PDF.">
  <link rel="icon" type="image/png" href="/logo-3degraus.png">
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>

  <!-- Header Bar -->
  <header class="app-header">
    <div class="brand-title">
      <img src="/logo-3degraus.png" alt="3Degraus Logo" id="header-logo">
      <h1>GERADOR DE ORÇAMENTOS</h1>
    </div>
    <div class="header-actions">
      <button id="load-demo-btn" class="btn btn-secondary btn-sm" title="Carregar Dados de Exemplo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Exemplo Demo
      </button>
      <button id="export-pdf-btn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar PDF
      </button>
    </div>
  </header>

  <!-- App Main Container -->
  <main class="app-container">

    <!-- Left Editor Panel -->
    <aside class="editor-panel">

      <!-- Client Details Card -->
      <section class="panel-card">
        <div class="panel-card-header">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Informações do Cliente
          </h2>
        </div>
        <div class="form-group">
          <label class="form-label" for="client-name-input">Nome do Cliente</label>
          <input type="text" id="client-name-input" class="form-control" placeholder="ex: 7 Mares PV" value="7 Mares PV">
        </div>
        <div class="form-group">
          <label class="form-label">Logo do Cliente (Opcional)</label>
          <input type="file" id="client-logo-input" class="form-control" accept="image/*">
        </div>
      </section>

      <!-- Budget Tables Items Card -->
      <section class="panel-card">
        <div class="panel-card-header">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Tabelas de Orçamento
          </h2>
          <button id="add-item-btn" class="btn btn-secondary btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova Tabela
          </button>
        </div>

        <div id="items-editor-container">
          <!-- Dynamic Items inserted by JS -->
        </div>
      </section>

    </aside>

    <!-- Right Live Preview Document Panel -->
    <section class="preview-panel">

      <div class="preview-toolbar">
        <span class="preview-title">👁️ Pré-Visualização em Tempo Real (Documento A4)</span>
      </div>

      <!-- Printable A4 Document replicating Orçamento Chaveiros.pdf -->
      <article id="pdf-document" class="pdf-document">

        <!-- Top Header -->
        <header class="doc-header">
          <div class="doc-logo-box">
            <img src="/logo-3degraus.png" alt="3Degraus Logo" id="doc-logo-3degraus">
          </div>
          <div class="doc-title-box">
            <h1 class="doc-main-title">ORÇAMENTO CHAVEIROS</h1>
            <div class="doc-client-info">
              CLIENTE: <span id="doc-client-name-display">7 Mares PV</span>
              <img id="doc-client-logo-display" class="doc-client-logo hidden" alt="Logo Cliente">
            </div>
          </div>
        </header>

        <!-- Dynamic Budget Items Rows -->
        <div id="doc-items-preview-container">
          <!-- Item rows inserted dynamically -->
        </div>

        <!-- Footer -->
        <footer class="doc-footer">
          <div class="doc-total-badge">
            <span class="doc-total-label">VALOR TOTAL:</span>
            <span id="doc-grand-total-display" class="doc-total-value">R$ 0,00</span>
          </div>
          <div class="doc-watermark">
            3Degraus • Soluções em Chaveiros Personalizados
          </div>
        </footer>

      </article>

    </section>

  </main>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
